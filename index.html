<!DOCTYPE html>
<html lang="id">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perpustakaan Prof. Naufal</title>
    <style>
      :root { --ink: #1f2430; --muted: #6b7280; --line: #e7e5e0; --bg: #f6f3ee; --card: #fff; --brand: #2f5d50; --brand-2: #c8873a; --danger: #b4423a; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
      header { background: linear-gradient(120deg, #23463c, #2f5d50 60%, #3d7563); color: #fff; padding: 2.4rem 1rem 4.6rem; text-align: center; }
      header h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: .01em; }
      header p { margin: .4rem 0 0; opacity: .85; }
      main { max-width: 1080px; margin: -3rem auto 2rem; padding: 0 1rem; display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
      @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
      section { background: var(--card); padding: 1.25rem; margin-bottom: 1.25rem; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 30px -18px rgba(31,36,48,.35); }
      h2 { margin: 0 0 1rem; font-size: 1.1rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
      h2 .count { font-size: .78rem; font-weight: 700; background: #eef3f1; color: var(--brand); border-radius: 999px; padding: .15rem .6rem; }
      .left-column section { position: sticky; top: 1rem; }
      form div { margin-bottom: .85rem; }
      form label { display: block; margin-bottom: .3rem; font-weight: 600; font-size: .9rem; }
      form .checkbox-container { display: flex; align-items: center; gap: .5rem; }
      form .checkbox-container input { width: 18px; height: 18px; accent-color: var(--brand); }
      form .checkbox-container label { margin: 0; font-weight: 500; }
      input[type='text'], input[type='number'], input[type='search'] { width: 100%; padding: .65rem .75rem; border: 1.5px solid var(--line); border-radius: 10px; font: inherit; background: #fff; }
      input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(47,93,80,.12); }
      button { cursor: pointer; padding: .65rem 1rem; border: none; border-radius: 10px; color: #fff; background: var(--brand); font: inherit; font-weight: 600; transition: filter .15s, transform .15s; }
      button:hover { filter: brightness(1.08); }
      button:active { transform: translateY(1px); }
      form button[type='submit'] { width: 100%; margin-top: .25rem; }
      #searchBook { display: flex; gap: .5rem; align-items: center; }
      #searchBook label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      #searchBook input { flex: 1; }
      #searchBook button { width: auto; margin: 0; }
      .book_item { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: .25rem .9rem; border: 1px solid var(--line); padding: .9rem; border-radius: 12px; margin-bottom: .65rem; background: #fffdf9; transition: box-shadow .2s, transform .2s; }
      .book_item:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -16px rgba(31,36,48,.5); }
      .book_item::before { content: attr(data-initial); grid-row: span 3; display: grid; place-items: center; height: 70px; border-radius: 6px 10px 10px 6px; background: linear-gradient(135deg, var(--brand), #4f8a77); color: #fff; font: 700 1.3rem Georgia, serif; box-shadow: inset 5px 0 0 rgba(0,0,0,.15); }
      .book_item.done::before { background: linear-gradient(135deg, var(--brand-2), #e0a55e); }
      .book_item h3 { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
      .book_item p { margin: 0; font-size: .88rem; color: var(--muted); }
      .book_item .action { grid-column: 1 / -1; margin-top: .6rem; display: flex; flex-wrap: wrap; gap: .4rem; }
      .book_item .action button { flex: 1 1 auto; font-size: .82rem; padding: .5rem .7rem; }
      .green { background: var(--brand); }
      .red { background: #fff; color: var(--danger); border: 1.5px solid #f0d0cc; }
      .blue { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
      .empty { color: var(--muted); font-size: .92rem; text-align: center; padding: 1.2rem 0; margin: 0; }
      dialog { border: 0; border-radius: 16px; padding: 1.4rem; width: min(420px, 92vw); box-shadow: 0 30px 60px -20px rgba(0,0,0,.45); }
      dialog::backdrop { background: rgba(31,36,48,.45); }
      dialog h3 { margin: 0 0 1rem; }
      dialog .row { display: flex; gap: .5rem; justify-content: flex-end; margin-top: .5rem; }
      dialog .row .ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
      footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 1rem 2rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>Perpustakaan Prof. Naufal</h1>
      <p>Catat buku yang sedang dan sudah kamu baca. Data tersimpan di browser.</p>
    </header>

    <main>
      <div class="left-column">
        <section class="input_section">
          <h2>Tambah Buku Baru</h2>
          <form id="bookForm" data-testid="bookForm">
            <div>
              <label for="bookFormTitle">Judul</label>
              <input id="bookFormTitle" type="text" required data-testid="bookFormTitleInput"/>
            </div>
            <div>
              <label for="bookFormAuthor">Penulis</label>
              <input id="bookFormAuthor" type="text" required data-testid="bookFormAuthorInput"/>
            </div>
            <div>
              <label for="bookFormYear">Tahun</label>
              <input id="bookFormYear" type="number" min="1000" max="2100" required data-testid="bookFormYearInput"/>
            </div>
            <div class="checkbox-container">
              <input id="bookFormIsComplete" type="checkbox" data-testid="bookFormIsCompleteCheckbox"/>
              <label for="bookFormIsComplete">Selesai dibaca</label>
            </div>
            <button id="bookFormSubmit" type="submit" data-testid="bookFormSubmitButton">
              Masukkan Buku ke rak <span>Belum selesai dibaca</span>
            </button>
          </form>
        </section>
      </div>

      <div class="right-column">
        <section class="search_section">
          <h2>Cari Buku</h2>
          <form id="searchBook" data-testid="searchBookForm">
            <label for="searchBookTitle">Judul</label>
            <input id="searchBookTitle" type="text" placeholder="Cari judul buku…" data-testid="searchBookFormTitleInput"/>
            <button id="searchSubmit" type="submit" data-testid="searchBookFormSubmitButton">
              Cari
            </button>
          </form>
        </section>

        <section class="book_shelf">
          <h2>Belum selesai dibaca <span class="count" id="incompleteCount">0</span></h2>
          <div id="incompleteBookList" data-testid="incompleteBookList"></div>
        </section>

        <section class="book_shelf">
          <h2>Selesai dibaca <span class="count" id="completeCount">0</span></h2>
          <div id="completeBookList" data-testid="completeBookList"></div>
        </section>
      </div>
    </main>

    <dialog id="editDialog">
      <form id="editForm" method="dialog">
        <h3>Edit buku</h3>
        <div><label for="editTitle">Judul</label><input id="editTitle" type="text" required /></div>
        <div><label for="editAuthor">Penulis</label><input id="editAuthor" type="text" required /></div>
        <div><label for="editYear">Tahun</label><input id="editYear" type="number" min="1000" max="2100" required /></div>
        <div class="row"><button type="button" class="ghost" id="editCancel">Batal</button><button type="submit">Simpan</button></div>
      </form>
    </dialog>
    <footer>Submission Dicoding · Belajar Membuat Front-End Web untuk Pemula</footer>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const books = [];
        const RENDER_EVENT = 'render-book';
        const SAVED_EVENT = 'saved-book';
        const STORAGE_KEY = 'BOOKSHELF_APPS';

        const bookForm = document.getElementById('bookForm');
        const bookFormSubmit = document.getElementById('bookFormSubmit');
        const bookFormIsCompleteCheckbox = document.getElementById('bookFormIsComplete');

        const searchForm = document.getElementById('searchBook');
        const searchInput = document.getElementById('searchBookTitle');

        // --- Utility Functions ---

        function isStorageExist() {
          if (typeof Storage === 'undefined') {
            alert('Browser kamu tidak mendukung local storage');
            return false;
          }
          return true;
        }

        function generateId() {
          return +new Date();
        }

        function generateBookObject(id, title, author, year, isComplete) {
          return {
            id,
            title,
            author,
            year: parseInt(year),
            isComplete,
          };
        }

        function findBook(bookId) {
          for (const bookItem of books) {
            if (bookItem.id === bookId) {
              return bookItem;
            }
          }
          return null;
        }

        function findBookIndex(bookId) {
          for (const index in books) {
            if (books[index].id === bookId) {
              return index;
            }
          }
          return -1;
        }

        // --- Local Storage Functions ---

        function saveData() {
          if (isStorageExist()) {
            const parsed = JSON.stringify(books);
            localStorage.setItem(STORAGE_KEY, parsed);
            document.dispatchEvent(new Event(SAVED_EVENT));
          }
        }

        function loadDataFromStorage() {
          const serializedData = localStorage.getItem(STORAGE_KEY);
          let data = JSON.parse(serializedData);

          if (data !== null) {
            for (const book of data) {
              books.push(book);
            }
          }

          document.dispatchEvent(new Event(RENDER_EVENT));
        }

        // --- Book Manipulation Functions ---

        function addBook() {
          const title = document.getElementById('bookFormTitle').value;
          const author = document.getElementById('bookFormAuthor').value;
          const year = document.getElementById('bookFormYear').value;
          const isComplete = document.getElementById('bookFormIsComplete').checked;

          const generatedID = generateId();
          const bookObject = generateBookObject(
            generatedID,
            title,
            author,
            year,
            isComplete,
          );
          books.push(bookObject);

          document.dispatchEvent(new Event(RENDER_EVENT));
          saveData();
        }

        function addBookToCompleted(bookId) {
          const bookTarget = findBook(bookId);

          if (bookTarget == null) return;

          bookTarget.isComplete = true;
          document.dispatchEvent(new Event(RENDER_EVENT));
          saveData();
        }

        function undoBookFromCompleted(bookId) {
          const bookTarget = findBook(bookId);

          if (bookTarget == null) return;

          bookTarget.isComplete = false;
          document.dispatchEvent(new Event(RENDER_EVENT));
          saveData();
        }

        function removeBook(bookId) {
          const bookTargetIndex = findBookIndex(bookId);

          if (bookTargetIndex === -1) return;

          books.splice(bookTargetIndex, 1);
          document.dispatchEvent(new Event(RENDER_EVENT));
          saveData();
        }
        
        let editingId = null;
        const editDialog = document.getElementById('editDialog');
        function editBook(bookId) {
          const bookTarget = findBook(bookId);
          if (bookTarget == null) return;
          editingId = bookId;
          document.getElementById('editTitle').value = bookTarget.title;
          document.getElementById('editAuthor').value = bookTarget.author;
          document.getElementById('editYear').value = bookTarget.year;
          if (editDialog.showModal) editDialog.showModal();
        }
        document.getElementById('editCancel').addEventListener('click', () => editDialog.close());
        document.getElementById('editForm').addEventListener('submit', function (event) {
          event.preventDefault();
          const bookTarget = findBook(editingId);
          if (bookTarget) {
            bookTarget.title = document.getElementById('editTitle').value.trim();
            bookTarget.author = document.getElementById('editAuthor').value.trim();
            bookTarget.year = parseInt(document.getElementById('editYear').value);
            document.dispatchEvent(new Event(RENDER_EVENT));
            saveData();
          }
          editDialog.close();
        });

        // --- DOM Creation ---

        function makeBook(bookObject) {
          const bookContainer = document.createElement('div');
          bookContainer.setAttribute('data-bookid', bookObject.id);
          bookContainer.setAttribute('data-testid', 'bookItem');
          bookContainer.classList.add('book_item');
          if (bookObject.isComplete) bookContainer.classList.add('done');
          bookContainer.setAttribute('data-initial', (bookObject.title.trim()[0] || '?').toUpperCase());

          const titleElement = document.createElement('h3');
          titleElement.setAttribute('data-testid', 'bookItemTitle');
          titleElement.innerText = bookObject.title;

          const authorElement = document.createElement('p');
          authorElement.setAttribute('data-testid', 'bookItemAuthor');
          authorElement.innerText = `Penulis: ${bookObject.author}`;
          
          const yearElement = document.createElement('p');
          yearElement.setAttribute('data-testid', 'bookItemYear');
          yearElement.innerText = `Tahun: ${bookObject.year}`;

          const actionContainer = document.createElement('div');
          actionContainer.classList.add('action');

          const completeButton = document.createElement('button');
          completeButton.setAttribute('data-testid', 'bookItemIsCompleteButton');
          
          if (bookObject.isComplete) {
            completeButton.innerText = 'Baca lagi';
            completeButton.classList.add('green');
            completeButton.addEventListener('click', function () {
              undoBookFromCompleted(bookObject.id);
            });
          } else {
            completeButton.innerText = 'Tandai selesai';
            completeButton.classList.add('green');
            completeButton.addEventListener('click', function () {
              addBookToCompleted(bookObject.id);
            });
          }

          const deleteButton = document.createElement('button');
          deleteButton.setAttribute('data-testid', 'bookItemDeleteButton');
          deleteButton.innerText = 'Hapus';
          deleteButton.classList.add('red');
          deleteButton.addEventListener('click', function () {
            if (confirm('Apakah Anda yakin ingin menghapus buku ini?')) {
              removeBook(bookObject.id);
            }
          });
          
          const editButton = document.createElement('button');
          editButton.setAttribute('data-testid', 'bookItemEditButton');
          editButton.innerText = 'Edit';
          editButton.classList.add('blue');
          editButton.addEventListener('click', function () {
            editBook(bookObject.id);
          });

          actionContainer.append(completeButton, deleteButton, editButton);
          bookContainer.append(titleElement, authorElement, yearElement, actionContainer);

          return bookContainer;
        }

        // --- Event Listeners ---

        bookForm.addEventListener('submit', function (event) {
          event.preventDefault();
          addBook();
          bookForm.reset();
          bookFormSubmit.querySelector('span').innerText = 'Belum selesai dibaca';
        });

        bookFormIsCompleteCheckbox.addEventListener('change', function () {
          const submitSpan = bookFormSubmit.querySelector('span');
          if (bookFormIsCompleteCheckbox.checked) {
            submitSpan.innerText = 'Selesai dibaca';
          } else {
            submitSpan.innerText = 'Belum selesai dibaca';
          }
        });
        
        searchForm.addEventListener('submit', function (event) {
          event.preventDefault();
          document.dispatchEvent(new Event(RENDER_EVENT));
        });
        
        // Also render on input change for live search
        searchInput.addEventListener('keyup', function() {
          document.dispatchEvent(new Event(RENDER_EVENT));
        });

        document.addEventListener(RENDER_EVENT, function () {
          const incompleteBookList = document.getElementById('incompleteBookList');
          incompleteBookList.innerHTML = '';

          const completeBookList = document.getElementById('completeBookList');
          completeBookList.innerHTML = '';
          
          const searchTerm = searchInput.value.toLowerCase();
          const filteredBooks = books.filter(book => book.title.toLowerCase().includes(searchTerm));

          for (const bookItem of filteredBooks) {
            const bookElement = makeBook(bookItem);
            if (!bookItem.isComplete) {
              incompleteBookList.append(bookElement);
            } else {
              completeBookList.append(bookElement);
            }
          }
          const incompleteTotal = filteredBooks.filter((b) => !b.isComplete).length;
          const completeTotal = filteredBooks.length - incompleteTotal;
          document.getElementById('incompleteCount').innerText = incompleteTotal;
          document.getElementById('completeCount').innerText = completeTotal;
          const emptyText = searchTerm ? 'Tidak ada buku yang cocok.' : 'Belum ada buku di rak ini.';
          if (!incompleteTotal) incompleteBookList.innerHTML = '<p class="empty">' + emptyText + '</p>';
          if (!completeTotal) completeBookList.innerHTML = '<p class="empty">' + emptyText + '</p>';
        });

        document.addEventListener(SAVED_EVENT, function () {
          console.log('Data berhasil disimpan.');
        });
        
        // --- Initial Load ---

        if (isStorageExist()) {
          loadDataFromStorage();
        }
      });
    </script>
  </body>
</html>
